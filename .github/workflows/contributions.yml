name: Atualizar calendário de contribuições

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate_contributions.py
      - tests/test_contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: contributions-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Validar geração do calendário
        run: python3 -m unittest discover -s tests -v

      - name: Gerar imagens com os dados oficiais
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_contributions.py --username "$GITHUB_USERNAME"

      - name: Publicar imagens atualizadas
        run: |
          git add -- assets/contributions-light.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza calendário de contribuições"
          git push origin HEAD:main
